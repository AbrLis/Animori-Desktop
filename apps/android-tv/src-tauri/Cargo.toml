[package]
name = "animori"
version = "3.0.2"
description = "AniMori — Toolkit for AniList, shell for Android TV"
authors = ["foulnike"]
license = "MIT"
repository = "https://github.com/foulnike/Animori"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "animori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Сохранение трека темы (export.rs): тело файла приходит из разметки строкой
# base64, и его надо разобрать в байты перед записью. Другого безпотерьного
# вида у канала IPC нет: там только строки, и текстовый путь портит любой
# байт вне UTF-8 — то же решение, что у загрузки датасета названий.
#
# Версия не на глаз: эту же мажорную уже тянет сам tauri (см. Cargo.lock),
# так что второго набора одних и тех же типов в сборке не появится.
base64 = "0.22"

# unsafe-headers — про Kodik, и без него источник не работает вовсе.
#
# Плагин по умолчанию выбрасывает Referer, потому что спецификация fetch держит
# его за запрещённый заголовок. Правило это про страницу в браузере: там Referer
# ставит сам движок, и подделывать его разметке не дают. Наши запросы идут не со
# страницы, а из процесса оболочки, где документа-источника нет вовсе, — запрещать
# тут нечего, а адрес запроса мы и так задаём сами.
#
# Kodik же на заголовке держится: страница серии без него отдаёт заглушку без
# подписей, а /ftor чужую подпись не принимает. Проба цепочки шла из консоли,
# где заголовок уходил как есть, поэтому вскрылось это только на живом прогоне.
tauri-plugin-http = { version = "2", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "socks",
  "unsafe-headers",
] }

tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2.5.4"
# Пункт 4.5: память геометрии окна — объявлена ниже, в секции десктопных
# зависимостей: плагин desktop-only, и под Android TV его нет вовсе.

# dialog нужен ровно для одного: выбрать папку для выгрузки списка и трека темы
# (export.rs). Своего окна выбора у оболочки нет, а чужой путь в приватный каталог
# человек не найдёт.
#
# Плагин дёргается ТОЛЬКО из Rust. Разрешения разметке не выданы сознательно:
# dialog:default означал бы право открывать окна выбора файлов без нашего ведома.
tauri-plugin-dialog = "2"

# Десктопная зависимость одна — память геометрии окна (пункт 4.5).
#
# Плагин под Android и iOS отсутствует вовсе, поэтому объявлен отдельной
# секцией по цели, а не среди общих зависимостей: иначе сборка под Android
# падает внутри чужого крейта, и вина выглядит не нашей.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Доступ к движку окна из Rust.
#
# Зачем нужны эти две зависимости. Потребитель один — proxy_auth.rs: запрос
# учётных данных у прокси приходит событием WebView2, и ответить на него можно
# только на уровне самого движка. Событие живёт в COM-интерфейсах Microsoft,
# а обёртки к ним и есть webview2-com и windows.
#
# Прежде тем же способом отменялись рекламные запросы внутри кадра плеера.
# Блокировщик ушёл вместе с гибридным окном, крейты остались ради прокси.
#
# Версии подобраны НЕ на глаз: их уже тянет wry 0.55.1 (движок окон Tauri), см.
# Cargo.lock — webview2-com 0.38.2, windows 0.61.3. Брать другую мажорную версию нельзя:
# тогда в сборке окажутся два несовместимых набора одних и тех же типов, и
# PlatformWebview::controller() перестанет подходить к нашему коду.
#
# cfg(windows) обязателен: этих крейтов нет ни под Linux, ни под macOS, и без
# ограничения по платформе проект перестал бы собираться где угодно, кроме Windows.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }

name: Ошибка
description: Что-то работает не так
labels: ['bug']
body:
  - type: input
    id: version
    attributes:
      label: Версия
      description: Настройки, раздел «О программе». Номер стоит и внизу рельсы.
      placeholder: 3.0.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Приставка и Android
      description: Модель и версия системы. Разрядность — adb shell getprop ro.product.cpu.abi.
      placeholder: Haier Android TV, Android 14, armeabi-v7a
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Экран
      options:
        - Главная
        - Моё
        - История
        - Поиск
        - Тайтл
        - Студия
        - Просмотр
        - Настройки
        - Журнал
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что делали, чего ждали, что получилось
      description: Пошагово. Снимок экрана можно перетащить сюда.
      placeholder: |
        1. Открыл карточку тайтла.
        2. Нажал «Смотреть».
        Ждал плеер, получил пустое окно.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал
      description: Вывод adb logcat, если есть доступ по adb. Необязательно.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Стоит последний выпуск
          required: true
        - label: Поиск по существующим issue ничего похожего не дал
          required: true

name: Идея
description: Новая возможность или улучшение
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Что неудобно сейчас
      description: Как обходитесь без этого и чем мешает.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Каким видите поведение
      description: Где это в интерфейсе и что происходит по нажатию.
    validations:
      required: true
  - type: textarea
    id: remote
    attributes:
      label: Как этим управлять пультом
      description: Какими кнопками и откуда берётся фокус. Необязательно.
  - type: textarea
    id: extra
    attributes:
      label: Что ещё важно
      description: Ссылки, примеры, наброски. Необязательно.

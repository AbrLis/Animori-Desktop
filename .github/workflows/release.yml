# РЎР±РѕСЂРєР° Рё РІС‹РєР»Р°РґРєР° СЂРµР»РёР·Р° РїСЂРёР»РѕР¶РµРЅРёСЏ. Р—Р°РїСѓСЃРє С‚РѕР»СЊРєРѕ РїРѕ С‚РµРіСѓ windows-v<РІРµСЂСЃРёСЏ>. РџРѕ РїСѓС€Сѓ РІ РІРµС‚РєСѓ
# СЃР±РѕСЂРєР° РЅРµ РёРґС‘С‚: РєР°Р¶РґС‹Р№ РїСЂРѕРіРѕРЅ вЂ” СЌС‚Рѕ РїРѕР»РЅР°СЏ РєРѕРјРїРёР»СЏС†РёСЏ Rust РЅР° windows-latest, Р° СЃРјС‹СЃР» РѕРЅР° РёРјРµРµС‚
# С‚РѕР»СЊРєРѕ РґР»СЏ РІС‹РїСѓСЃРєР°.

name: release

on:
  push:
    tags:
      - 'windows-v*'

  # Р СѓС‡РЅРѕР№ Р·Р°РїСѓСЃРє вЂ” РґР»СЏ РїСЂРѕРіРѕРЅР° Р±РµР· РІС‹РїСѓСЃРєР°: РєРѕРЅРІРµР№РµСЂ СЃС‚РѕРёС‚ РїСЂРѕРІРµСЂРёС‚СЊ Р·Р°СЂР°РЅРµРµ
  # (Rust, Tauri, РїРѕРґРїРёСЃСЊ). РџСЂРѕР±РЅС‹Р№ РїСЂРѕРіРѕРЅ СЃРѕР±РёСЂР°РµС‚ Рё РїРѕРґРїРёСЃС‹РІР°РµС‚, РЅРѕ РЅРёС‡РµРіРѕ РЅРµ
  # РїСѓР±Р»РёРєСѓРµС‚. РЈ РїСЂРёСЃС‚Р°РІРєРё С‚Р°РєРѕР№ Р¶Рµ СЂРµР¶РёРј: С€Р°РіРё РїСѓР±Р»РёРєР°С†РёРё РѕС‚СЃРµРєР°СЋС‚СЃСЏ СѓСЃР»РѕРІРёРµРј.
  workflow_dispatch:
    inputs:
      tag:
        description: 'РўРµРі РІС‹РїСѓСЃРєР°'
        required: true
        default: 'windows-v3.1.1'
      dry:
        description: 'РџСЂРѕР±РЅС‹Р№ РїСЂРѕРіРѕРЅ: СЃРѕР±СЂР°С‚СЊ Рё РїРѕРґРїРёСЃР°С‚СЊ, РЅРѕ СЂРµР»РёР· РЅРµ РїСѓР±Р»РёРєРѕРІР°С‚СЊ'
        type: boolean
        default: true

# Р‘РµР· СЌС‚РѕРіРѕ С‚РѕРєРµРЅ РїСЂРѕРіРѕРЅР° С‚РѕР»СЊРєРѕ С‡РёС‚Р°РµС‚, Рё СЃРѕР·РґР°РЅРёРµ СЂРµР»РёР·Р° СѓРїР°РґС‘С‚ РЅР° 403.
permissions:
  contents: write

jobs:
  release:
    # РљРѕРґ РЅР°СЃС‚РѕР»СЊРЅРѕРіРѕ РїСЂРёР»РѕР¶РµРЅРёСЏ Р»РµР¶РёС‚ РІ apps/windows, Р° РєРѕРЅРІРµР№РµСЂ вЂ” РІ РєРѕСЂРЅРµ: GitHub С‡РёС‚Р°РµС‚
    # .github/workflows С‚РѕР»СЊРєРѕ РѕС‚С‚СѓРґР°. РљР°С‚Р°Р»РѕРі Р·Р°РґР°С‘С‚СЃСЏ Р·Р°РґР°С‡РµР№, Р° РЅРµ РїСѓС‚СЏРјРё РІ РєРѕРјР°РЅРґР°С….
    defaults:
      run:
        working-directory: apps/windows

    # РўРѕР»СЊРєРѕ Windows: С†РµР»РµР№ СЃР±РѕСЂРєРё РґРІРµ вЂ” nsis Рё msi.
    runs-on: windows-latest

    steps:
      - name: РСЃС…РѕРґРЅС‹Р№ РєРѕРґ
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Node 24 вЂ” С‚Р° Р¶Рµ РІРµСЂСЃРёСЏ, С‡С‚Рѕ РІ ci.yml Рё release-tv.yml: lock РіРµРЅРµСЂРёСЂСѓРµС‚
          # npm 11, Р° npm 10 РёР· node 22 РѕС‚РІРµСЂРіР°РµС‚ РµРіРѕ РЅР° npm ci вЂ”
          # В«Missing: esbuild@0.28.2 from lock fileВ».
          node-version: 24
          cache: npm

      # РќРѕРјРµСЂ РІРµСЂСЃРёРё РёР· РёРјРµРЅРё С‚РµРіР° Рё СЃРІРµСЂРєР° СЃ package.json. РќРѕРјРµСЂ Р±РµСЂС‘С‚СЃСЏ РѕР±СЂР°Р·С†РѕРј, Р° РЅРµ РѕС‚СЂРµР·Р°РЅРёРµРј
      # РїСЂРёСЃС‚Р°РІРєРё: С‚РµРі windows-v3.0 С‚РёС…Рѕ РґР°Р» Р±С‹ СЃС‚СЂР°РЅРЅРѕРµ РёРјСЏ РїРѕСЂС‚Р°Р±Р»-Р°СЂС…РёРІР° РІРјРµСЃС‚РѕвЂ¦
      - name: РќРѕРјРµСЂ РІРµСЂСЃРёРё РёР· С‚РµРіР°
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^windows-v(?<v>\d+\.\d+\.\d+)$') {
            throw "РРјСЏ С‚РµРіР° '$tag' РЅРµ РїРѕРґС…РѕРґРёС‚ РїРѕРґ windows-v<РІРµСЂСЃРёСЏ>"
          }
          $version = $Matches['v']
          $declared = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ($version -ne $declared) {
            throw "РќРѕРјРµСЂ РІ С‚РµРіРµ ($version) СЂР°СЃС…РѕРґРёС‚СЃСЏ СЃ package.json ($declared)"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "version=$version"
          Write-Host "Р’С‹РїСѓСЃРє РїСЂРёР»РѕР¶РµРЅРёСЏ: $version (С‚РµРі $tag)"

      # РўРµРєСЃС‚ РІРµСЂС…РЅРµРіРѕ СЂР°Р·РґРµР»Р° CHANGELOG СѓС…РѕРґРёС‚ Рё РІ РѕРїРёСЃР°РЅРёРµ СЂРµР»РёР·Р°, Рё РІ РѕРєРЅРѕ РѕР±РЅРѕРІР»РµРЅРёСЏ РІРЅСѓС‚СЂРё
      # РїСЂРёР»РѕР¶РµРЅРёСЏ: Р°РїРґРµР№С‚РµСЂ РїРѕРєР°Р·С‹РІР°РµС‚ РїРѕР»СЊР·РѕРІР°С‚РµР»СЋ СЂРѕРІРЅРѕ С‚Рѕ, С‡С‚Рѕ Р»РµР¶РёС‚ РІ РїРѕР»Рµ notes РјР°РЅРёС„РµСЃС‚Р°.
      - name: РћРїРёСЃР°РЅРёРµ СЂРµР»РёР·Р° РёР· CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $marks = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match '^## \[' }
          if ($marks.Count -eq 0) {
            throw 'Р’ CHANGELOG.md РЅРµ РЅР°Р№РґРµРЅРѕ РЅРё РѕРґРЅРѕРіРѕ СЂР°Р·РґРµР»Р° РІРёРґР° "## [РІРµСЂСЃРёСЏ]"'
          }
          $from = $marks[0] + 1
          $to = if ($marks.Count -gt 1) { $marks[1] - 1 } else { $lines.Count - 1 }
          $body = ($lines[$from..$to] -join "`n").Trim()
          # РџРѕС‚РѕР»РѕРє РЅР° СЃР»СѓС‡Р°Р№ РѕС‡РµРЅСЊ Р±РѕР»СЊС€РѕРіРѕ СЂР°Р·РґРµР»Р°: С‚РµР»Рѕ СЂРµР»РёР·Р° СѓС…РѕРґРёС‚ РІ РјР°РЅРёС„РµСЃС‚
          # РѕР±РЅРѕРІР»РµРЅРёР№, СЂР°Р·РґСѓРІР°С‚СЊ РµРіРѕ РЅРµС‡РµРј.
          if ($body.Length -gt 3000) {
            $body = $body.Substring(0, 3000).TrimEnd() + "`n`nвЂ¦РїРѕР»РЅС‹Р№ СЃРїРёСЃРѕРє РёР·РјРµРЅРµРЅРёР№ вЂ” РІ CHANGELOG.md"
          }
          # РџРѕРґРІР°Р» РїРѕСЃР»Рµ РѕР±СЂРµР·РєРё, С‡С‚РѕР±С‹ РѕРЅР° РµРіРѕ РЅРµ СЃСЉРµР»Р°: РїСЂР°РІРѕРІС‹Рµ РґРѕРєСѓРјРµРЅС‚С‹ РЅР° СЃС‚СЂР°РЅРёС†Рµ РІС‹РїСѓСЃРєР°.
          $body = $body + "`n`nвЂ” РџРѕР»РёС‚РёРєР°: https://github.com/foulnike/Animori/blob/main/docs/PRIVACY.md В· РЈСЃР»РѕРІРёСЏ: https://github.com/foulnike/Animori/blob/main/docs/TERMS.md"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'body<<ANIMORI_NOTES'
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'ANIMORI_NOTES'
          Write-Host "Р’Р·СЏС‚Рѕ СЃС‚СЂРѕРє РѕРїРёСЃР°РЅРёСЏ: $($to - $from + 1)"

      - name: РћРєСЂСѓР¶РµРЅРёРµ Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # РљРѕРјРїРёР»СЏС†РёСЏ Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№ Tauri СЃ РЅСѓР»СЏ вЂ” СЌС‚Рѕ РјРёРЅСѓС‚С‹. РљСЌС€ РїСЂРёРІСЏР·Р°РЅ Рє Cargo.lock,
      # РєРѕС‚РѕСЂС‹Р№ Сѓ РЅР°СЃ Р·Р°РєРѕРјРјРёС‡РµРЅ, РїРѕСЌС‚РѕРјСѓ РїРѕРїР°РґР°РЅРёРµ Р±СѓРґРµС‚ СЃС‚Р°Р±РёР»СЊРЅС‹Рј.
      - name: РљСЌС€ Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      # РќСѓР¶РЅС‹ РґР»СЏ beforeBuildCommand: СЃР±РѕСЂРєСѓ РїРµСЂРµРґРЅРµРіРѕ РєСЂР°СЏ (npm run build:app) Р·Р°РїСѓСЃРєР°РµС‚ СЃР°Рј
      # tauri-action РїРµСЂРµРґ РєРѕРјРїРёР»СЏС†РёРµР№ Rust.
      # РЈСЃС‚Р°РЅРѕРІРєР° РёР· РєРѕСЂРЅСЏ: Р·Р°РјРѕРє РѕРґРёРЅ РЅР° СЂРµРїРѕР·РёС‚РѕСЂРёР№, РІ РєР°С‚Р°Р»РѕРіРµ РїСЂРёР»РѕР¶РµРЅРёСЏ РµРіРѕ РЅРµС‚.
      - name: Р—Р°РІРёСЃРёРјРѕСЃС‚Рё npm
        working-directory: .
        run: npm ci

      # РЎРѕР±РёСЂР°РµС‚ РїСЂРёР»РѕР¶РµРЅРёРµ, СЃРѕР·РґР°С‘С‚ СЂРµР»РёР· РїРѕ С‚РµРіСѓ, РїРѕРґРїРёСЃС‹РІР°РµС‚ СѓСЃС‚Р°РЅРѕРІС‰РёРє Рё СЃР°Рј РіРµРЅРµСЂРёСЂСѓРµС‚
      # latest.json. РџРёСЃР°С‚СЊ РјР°РЅРёС„РµСЃС‚ РІСЂСѓС‡РЅСѓСЋ РЅРµ РЅР°РґРѕ.
      # РџСЂРѕР±РЅС‹Р№ РїСЂРѕРіРѕРЅ: СЃР±РѕСЂРєР° Рё РїРѕРґРїРёСЃСЊ Р±РµР· РїСѓР±Р»РёРєР°С†РёРё. tauri-action СЃРѕР·РґР°С‘С‚ СЂРµР»РёР·
      # СЃР°Рј, РїРѕСЌС‚РѕРјСѓ РІ РїСЂРѕР±РЅРѕРј СЂРµР¶РёРјРµ РѕРЅ РЅРµ РёРґС‘С‚ РІРѕРІСЃРµ, Р° СЃР±РѕСЂРєР° РёРґС‘С‚ РЅР°РїСЂСЏРјСѓСЋ С‡РµСЂРµР·
      # tauri build. РћС‚РґРµР»СЊРЅС‹Р№ С€Р°Рі, Р° РЅРµ С„Р»Р°Рі РІРЅСѓС‚СЂРё: Сѓ tauri-action РЅРµС‚ В«СЃРѕР±СЂР°С‚СЊ, РЅРµ
      # РІС‹РєР»Р°РґС‹РІР°СЏВ», Рё Р·Р°Р±С‹С‚Р°СЏ РѕС‚СЃРµС‡РєР° РїСѓР±Р»РёРєСѓРµС‚ РІС‹РїСѓСЃРє РјРѕР»С‡Р°.
      - name: РџСЂРѕР±РЅС‹Р№ РїСЂРѕРіРѕРЅ, СЃР±РѕСЂРєР° Рё РїРѕРґРїРёСЃСЊ Р±РµР· РїСѓР±Р»РёРєР°С†РёРё
        if: github.event_name != 'push' && inputs.dry
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: РЎР±РѕСЂРєР° РїСЂРёР»РѕР¶РµРЅРёСЏ Рё РїСѓР±Р»РёРєР°С†РёСЏ СЂРµР»РёР·Р°
        if: github.event_name == 'push' || !inputs.dry
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # РџСЂРѕРµРєС‚ РїРµСЂРµРµС…Р°Р» РІ apps/windows: Р±РµР· СЌС‚РѕРіРѕ tauri-action РёСЃРєР°Р» Р±С‹ РµРіРѕ РІ РєРѕСЂРЅРµ
          # Рё РЅРµ РЅР°С€С‘Р», С‚Рѕ РµСЃС‚СЊ РІС‹РїСѓСЃРє РїР°РґР°Р» Р±С‹ РЅР° СЃР°РјРѕРј РїРµСЂРІРѕРј С€Р°РіРµ.
          projectPath: apps/windows
          # Р СѓС‡РЅРѕР№ Р·Р°РїСѓСЃРє РёРґС‘С‚ РЅРµ РїРѕ С‚РµРіСѓ: ref Сѓ РЅРµРіРѕ вЂ” РІРµС‚РєР°, Рё Р±РµР· РїРѕРґСЃС‚Р°РЅРѕРІРєРё
          # tauri-action РІС‹РїСѓСЃС‚РёР» Р±С‹ СЂРµР»РёР· СЃ С‚РµРіРѕРј `main`.
          tagName: ${{ inputs.tag || github.ref_name }}
          # РџР»Р°С‚С„РѕСЂРјР° РІ РЅР°Р·РІР°РЅРёРё: РѕР±Р° РїСЂРѕРґСѓРєС‚Р° Р¶РёРІСѓС‚ РІ РѕРґРЅРѕРј СЂРµРїРѕР·РёС‚РѕСЂРёРё, Рё Р±РµР· РЅРµС‘
          # РЅР° СЃС‚СЂР°РЅРёС†Рµ Releases РґРІРµ СЃС‚СЂРѕРєРё В«AniMori 3.1.1В» РЅРµ РѕС‚Р»РёС‡РёС‚СЊ. РќР°Р·РІР°РЅРёРµ
          # РЅРёС‡РµРіРѕ РЅРµ Р»РѕРјР°РµС‚ вЂ” Р°РїРґРµР№С‚РµСЂС‹ СЃРјРѕС‚СЂСЏС‚ РЅР° С‚РµРі, Р° РЅРµ РЅР° РЅРµРіРѕ.
          releaseName: AniMori ${{ steps.ver.outputs.version }} вЂ” Windows
          releaseBody: ${{ steps.notes.outputs.body }}
          # Р§РµСЂРЅРѕРІРёРє Рё РїСЂРµРґРІР°СЂРёС‚РµР»СЊРЅС‹Р№ СЂРµР»РёР· РѕР±Р° РІС‹РєР»СЋС‡РµРЅС‹: РѕР±Р° РґРµР»Р°СЋС‚ СЂРµР»РёР· РЅРµРІРёРґРёРјС‹Рј РґР»СЏ
          # РїРѕРґРїРёСЃС‡РёРєРѕРІ, Р° РїРѕРґРїРёСЃС‡РёРє РЅР° Releases РёС… РЅРµ РїРѕР»СѓС‡Р°РµС‚. РђРґСЂРµСЃ `releases/latest`
          # Р±РѕР»СЊС€Рµ РЅРµ РёСЃРїРѕР»СЊР·СѓРµС‚СЃСЏ вЂ” РєР°РЅР°Р» РѕР±РЅРѕРІР»РµРЅРёР№ Windows РґРµСЂР¶РёС‚ СЃРѕР±СЃС‚РІРµРЅРЅС‹Р№ СЂРµР»РёР·
          # windows-latest, СЃРј. РїРѕСЃР»РµРґРЅРёР№ С€Р°Рі.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # РџРѕ СѓРјРѕР»С‡Р°РЅРёСЋ (false) РјР°РЅРёС„РµСЃС‚ Р±РµСЂС‘С‚ РїРµСЂРІС‹Р№ РїРѕ РїСЂРёРѕСЂРёС‚РµС‚Сѓ СѓСЃС‚Р°РЅРѕРІС‰РёРє, Р° РїРµСЂРІС‹Р№ вЂ” РєР°Рє СЂР°Р·
          # msi: РІСЃРµ СѓСЃС‚Р°РЅРѕРІР»РµРЅРЅС‹Рµ РєРѕРїРёРё РїРѕСЃС‚Р°РІР»РµРЅС‹ NSIS Рё РїРѕС€Р»Рё Р±С‹ РѕР±РЅРѕРІР»СЏС‚СЊСЃСЏ С‡РµСЂРµР· msiexecвЂ¦
          updaterJsonPreferNsis: true

      # РљРѕСЂРѕС‚РєРѕРµ РёРјСЏ РґР»СЏ С‡РµР»РѕРІРµРєР°. РСЃС…РѕРґРЅС‹Р№ С„Р°Р№Р» РѕСЃС‚Р°С‘С‚СЃСЏ РЅР° РјРµСЃС‚Рµ РЅРµС‚СЂРѕРЅСѓС‚С‹Рј вЂ” РёРјРµРЅРЅРѕ РЅР° РЅРµРіРѕ
      # СЃСЃС‹Р»Р°РµС‚СЃСЏ latest.json.
      - name: РљРѕРїРёСЏ СѓСЃС‚Р°РЅРѕРІС‰РёРєР° РїРѕРґ РєРѕСЂРѕС‚РєРёРј РёРјРµРЅРµРј
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $setup = Get-ChildItem -Path src-tauri/target -Recurse -Filter *-setup.exe |
            Where-Object { $_.DirectoryName -match 'bundle\\nsis$' } |
            Select-Object -First 1
          if (-not $setup) {
            throw 'РЈСЃС‚Р°РЅРѕРІС‰РёРє NSIS РЅРµ РЅР°Р№РґРµРЅ вЂ” СЃР±РѕСЂРєР° С‡С‚Рѕ-С‚Рѕ РїРѕР»РѕР¶РёР»Р° РЅРµ С‚СѓРґР°'
          }
          Copy-Item $setup.FullName artifacts/AniMori_Setup.exe
          Write-Host "РСЃС…РѕРґРЅС‹Р№ Р°СЂС‚РµС„Р°РєС‚: $($setup.FullName)"

      # РџРѕСЂС‚Р°Р±Р»-РІРµСЂСЃРёСЏ. РћС‚РґРµР»СЊРЅРѕР№ С†РµР»Рё СЃР±РѕСЂРєРё РїРѕРґ РЅРµС‘ Сѓ Tauri РЅРµС‚: РїСЂРёР»РѕР¶РµРЅРёРµ вЂ” СЌС‚Рѕ РѕРґРёРЅ
      # СЃР°РјРѕРґРѕСЃС‚Р°С‚РѕС‡РЅС‹Р№ exe, РёРЅС‚РµСЂС„РµР№СЃ РІС€РёС‚ РІ Р±РёРЅР°СЂРЅРёРє РЅР° СЌС‚Р°РїРµ РєРѕРјРїРёР»СЏС†РёРё.
      - name: РџРѕСЂС‚Р°Р±Р»-Р°СЂС…РёРІ
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target -Recurse -Filter AniMori.exe |
            Where-Object { $_.DirectoryName -match 'release$' } |
            Select-Object -First 1
          if (-not $exe) {
            throw 'AniMori.exe РЅРµ РЅР°Р№РґРµРЅ РІ src-tauri/target'
          }
          $version = '${{ steps.ver.outputs.version }}'
          $stage = "portable/AniMori_$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage 'AniMori.exe')
          Copy-Item README.md (Join-Path $stage 'README.md')
          # LICENSE РѕРґРёРЅ РЅР° СЂРµРїРѕР·РёС‚РѕСЂРёР№ Рё Р»РµР¶РёС‚ РІ РµРіРѕ РєРѕСЂРЅРµ, Р° РЅРµ СЂСЏРґРѕРј СЃ РїСЂРёР»РѕР¶РµРЅРёРµРј:
          # РёРј РїРѕР»СЊР·СѓСЋС‚СЃСЏ РѕР±Р° РїСЂРѕРґСѓРєС‚Р°.
          Copy-Item ../../LICENSE (Join-Path $stage 'LICENSE')
          # РџРµСЂРµС‡РµРЅСЊ Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№ СЃ Р»РёС†РµРЅР·РёСЏРјРё: MPL-2.0 С‚СЂРµР±СѓРµС‚ СѓРІРµРґРѕРјР»РµРЅРёСЏ, Р° РїРѕСЂС‚Р°Р±Р»
          # СЂР°Р·Р±РёСЂР°СЋС‚ Р±РµР· СЂРµРїРѕР·РёС‚РѕСЂРёСЏ РїРѕРґ СЂСѓРєРѕР№ вЂ” Р·РЅР°С‡РёС‚, РїРµСЂРµС‡РµРЅСЊ РµРґРµС‚ РІРјРµСЃС‚Рµ СЃ РїСЂРѕРіСЂР°РјРјРѕР№.
          Copy-Item ../../docs/THIRD-PARTY.md (Join-Path $stage 'THIRD-PARTY.md')
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/AniMori_${version}_x64-portable.zip" -Force
          Write-Host "РџРѕСЂС‚Р°Р±Р» СЃРѕР±СЂР°РЅ РёР·: $($exe.FullName)"

      # РџСЂРѕР±РЅС‹Р№ РїСЂРѕРіРѕРЅ СЃСЋРґР° РЅРµ РґРѕС…РѕРґРёС‚: СЃР±РѕСЂРєР° Рё РїРѕРґРїРёСЃСЊ СѓР¶Рµ РїСЂРѕРІРµСЂРµРЅС‹, Р° РїСѓР±Р»РёРєРѕРІР°С‚СЊ РЅРµС‡РµРіРѕ.
      - name: Р”РѕР»РѕР¶РёС‚СЊ Р°СЂС‚РµС„Р°РєС‚С‹ РІ СЂРµР»РёР·
        if: ${{ github.event_name == 'push' || !inputs.dry }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # РџСѓС‚Рё РѕС‚ РєРѕСЂРЅСЏ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ: JavaScript-С€Р°РіРё РЅРµ Р·РЅР°СЋС‚ РїСЂРѕ
          # defaults.run.working-directory, Р° РєРѕРїРёСЂСѓСЋС‰РёРµ С€Р°РіРё РІС‹С€Рµ РєР»Р°РґСѓС‚ С„Р°Р№Р»С‹
          # РІ apps/windows/artifacts. Р‘РµР· РїСЂРµС„РёРєСЃР° С€Р°Рі РёСЃРєР°Р» Р±С‹ РёС… РІ РєРѕСЂРЅРµ Рё
          # РІС‹РїСѓСЃС‚РёР» Р±С‹ СЂРµР»РёР· Р±РµР· РїРµСЂРµРёРјРµРЅРѕРІР°РЅРЅРѕРіРѕ СѓСЃС‚Р°РЅРѕРІС‰РёРєР° Рё РїРѕСЂС‚Р°Р±Р»Р°.
          files: |
            apps/windows/artifacts/AniMori_Setup.exe
            apps/windows/artifacts/AniMori_*_x64-portable.zip

      # РљР°РЅР°Р» РѕР±РЅРѕРІР»РµРЅРёР№ Windows: РѕС‚РґРµР»СЊРЅС‹Р№ СЂРµР»РёР· СЃ РїРѕСЃС‚РѕСЏРЅРЅС‹Рј РёРјРµРЅРµРј, РІСЃРµРіРґР° СѓРєР°Р·С‹РІР°СЋС‰РёР№ РЅР°
      # РїРѕСЃР»РµРґРЅСЋСЋ СЃР±РѕСЂРєСѓ. Р—Р°С‡РµРј РѕРЅ РЅСѓР¶РµРЅ: Р°РїРґРµР№С‚РµСЂ С‡РёС‚Р°РµС‚ Р°РґСЂРµСЃ РїРѕ РёРјРµРЅРё, Р° `releases/latest`
      # РїРѕСЃР»Рµ РїРѕСЏРІР»РµРЅРёСЏ РІС‹РїСѓСЃРєРѕРІ РїСЂРёСЃС‚Р°РІРєРё РІ СЌС‚РѕРј Р¶Рµ СЂРµРїРѕР·РёС‚РѕСЂРёРё СѓРµР·Р¶Р°Р» Р±С‹ РЅР° РЅРёС… вЂ” Рё Windows
      # РјРѕР»С‡Р° РїРµСЂРµСЃС‚Р°Р» Р±С‹ РЅР°С…РѕРґРёС‚СЊ РѕР±РЅРѕРІР»РµРЅРёРµ. РЎРІРѕР№ РєР°РЅР°Р» РѕС‚ С‚Р°РєРѕРіРѕ РЅРµ Р·Р°РІРёСЃРёС‚.
      - name: РљР°РЅР°Р» РѕР±РЅРѕРІР»РµРЅРёР№ windows-latest
        # РЁР°Рі СѓРґР°Р»СЏРµС‚ РїСЂРµР¶РЅРёР№ РєР°РЅР°Р» Рё СЃРѕР·РґР°С‘С‚ РЅРѕРІС‹Р№: РІ РїСЂРѕР±РЅРѕРј РїСЂРѕРіРѕРЅРµ РѕРЅ РЅРµ РґРѕР»Р¶РµРЅ
        # С‚СЂРѕРіР°С‚СЊ Р¶РёРІРѕР№ РєР°РЅР°Р» РѕР±РЅРѕРІР»РµРЅРёР№ Сѓ Р»СЋРґРµР№ СЃ СѓР¶Рµ СѓСЃС‚Р°РЅРѕРІР»РµРЅРЅРѕР№ РїСЂРѕРіСЂР°РјРјРѕР№.
        if: ${{ github.event_name == 'push' || !inputs.dry }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channel = 'windows-latest'
          $sha = '${{ github.sha }}'
          $tag = '${{ inputs.tag || github.ref_name }}'

          # РњР°РЅРёС„РµСЃС‚ Р±РµСЂС‘Рј РёР· РІС‹РїСѓСЃРєР°, Р° РЅРµ РёС‰РµРј РїРѕ С„Р°Р№Р»РѕРІРѕР№ СЃРёСЃС‚РµРјРµ. tauri-action
          # РІС‹РєР»Р°РґС‹РІР°РµС‚ latest.json РїСЂСЏРјРѕ РІ СЂРµР»РёР· Рё РЅРµ РѕСЃС‚Р°РІР»СЏРµС‚ РµРіРѕ РІ src-tauri/target:
          # Р±РѕРµРІРѕР№ РїСЂРѕРіРѕРЅ РїР°РґР°Р» СЃ В«latest.json РЅРµ РЅР°Р№РґРµРЅВ», С…РѕС‚СЏ РјР°РЅРёС„РµСЃС‚ Р»РµР¶Р°Р» РІ
          # РІС‹РїСѓСЃРєРµ Рё Р±С‹Р» РїРѕРґРїРёСЃР°РЅ С‚РµРј Р¶Рµ РєР»СЋС‡РѕРј, С‡С‚Рѕ Рё СѓСЃС‚Р°РЅРѕРІС‰РёРє.
          #
          # РС‰РµРј РµРіРѕ Р”Рћ СѓРґР°Р»РµРЅРёСЏ РїСЂРµР¶РЅРµРіРѕ РєР°РЅР°Р»Р°: Р·Р°РјРµРЅСЏС‚СЊ РµСЃС‚СЊ С‡РµРј вЂ” РїСЂРѕРІРµСЂСЏРµРј СЂР°РЅСЊС€Рµ,
          # С‡РµРј Р»РѕРјР°РµРј, РёРЅР°С‡Рµ РѕР±РЅРѕРІР»РµРЅРёСЏ Сѓ Р»СЋРґРµР№ РїСЂРѕРїР°РґСѓС‚ РґРѕ СЂСѓС‡РЅРѕР№ РїРѕС‡РёРЅРєРё.
          New-Item -ItemType Directory -Force -Path manifest | Out-Null
          gh release download $tag --pattern 'latest.json' --dir 'manifest' --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "РќРµ СѓРґР°Р»РѕСЃСЊ СЃРєР°С‡Р°С‚СЊ latest.json РёР· РІС‹РїСѓСЃРєР° ${tag} вЂ” РєР°РЅР°Р» РЅРµС‡РµРј РЅР°РїРѕР»РЅРёС‚СЊ"
          }
          $manifest = Get-ChildItem 'manifest' -Filter 'latest.json' | Select-Object -First 1
          if (-not $manifest) {
            throw 'РњР°РЅРёС„РµСЃС‚ РЅРµ СЃРєР°С‡Р°Р»СЃСЏ вЂ” РєР°РЅР°Р» РЅРµС‡РµРј РЅР°РїРѕР»РЅРёС‚СЊ'
          }

          # РџСЂРµР¶РЅРёР№ РєР°РЅР°Р» СЃРЅРёРјР°РµРј С†РµР»РёРєРѕРј РІРјРµСЃС‚Рµ СЃ С‚РµРіРѕРј: РѕСЃС‚Р°РІРёС‚СЊ РµРіРѕ вЂ” Р·РЅР°С‡РёС‚ РѕРЅРёС‚СЊ РЅР°
          # СЃС‚СЂР°РЅРёС†Рµ Releases РІС‹РїСѓСЃРє СЃ С‡СѓР¶РёРј РјР°РЅРёС„РµСЃС‚РѕРј.
          gh release delete $channel --yes --cleanup-tag 2>$null

          gh release create $channel --target $sha --prerelease `
            --title 'AniMori: РєР°РЅР°Р» РѕР±РЅРѕРІР»РµРЅРёР№ Windows' `
            --notes 'РЈРєР°Р·Р°С‚РµР»СЊ РЅР° РїРѕСЃР»РµРґРЅРёР№ РІС‹РїСѓСЃРє windows. РћР±РЅРѕРІР»СЏРµС‚СЃСЏ РїСЂРё РєР°Р¶РґРѕРј РІС‹РїСѓСЃРєРµ, РІСЂСѓС‡РЅСѓСЋ РЅРµ РїСЂР°РІРёС‚СЊ. РџРѕРјРµС‡РµРЅ РїСЂРµРґРІР°СЂРёС‚РµР»СЊРЅС‹Рј, С‡С‚РѕР±С‹ РЅРµ Р·Р°РЅРёРјР°С‚СЊ РјРµС‚РєСѓ В«РїРѕСЃР»РµРґРЅРёР№ РІС‹РїСѓСЃРєВ» Рё РЅРµ СЃР±РёРІР°С‚СЊ СЂСѓС‡РЅС‹Рµ СЃСЃС‹Р»РєРё РЅР° СѓСЃС‚Р°РЅРѕРІС‰РёРє.'

          # РњР°РЅРёС„РµСЃС‚ Р±РµСЂС‘Рј РёР· РІС‹РІРѕРґР° СЃР±РѕСЂРєРё С‚РѕРіРѕ Р¶Рµ РїСЂРѕРіРѕРЅР°: РѕРЅ РїРѕРґРїРёСЃР°РЅ С‚РµРј Р¶Рµ РєР»СЋС‡РѕРј, С‡С‚Рѕ Рё
          # СЃР°Рј СѓСЃС‚Р°РЅРѕРІС‰РёРє, Рё РїРѕРґРјРµРЅСЏС‚СЊ РµРіРѕ СЃРІРѕРёРј РЅРµР»СЊР·СЏ.
          gh release upload $channel $manifest.FullName --clobber
          Write-Host "РњР°РЅРёС„РµСЃС‚ РєР°РЅР°Р»Р° РІР·СЏС‚ РёР· $($manifest.FullName)"

          # РџСЂРѕРІРµСЂРєР° С‚РµРј Р°РґСЂРµСЃРѕРј, РєРѕС‚РѕСЂС‹Р№ С‡РёС‚Р°РµС‚ Р°РїРґРµР№С‚РµСЂ: РєР°РЅР°Р» Р±РµР· СЌС‚РѕРіРѕ С€Р°РіР° РјРѕР¶РµС‚
          # РѕСЃС‚Р°С‚СЊСЃСЏ РїСѓСЃС‚С‹Рј, Рё РѕР±РЅРѕРІР»РµРЅРёСЏ РїРµСЂРµСЃС‚Р°РЅСѓС‚ РїСЂРёС…РѕРґРёС‚СЊ Р±РµР· РµРґРёРЅРѕР№ РѕС€РёР±РєРё РІ СЃР±РѕСЂРєРµ.
          $url = 'https://github.com/${{ github.repository }}/releases/download/' + $channel + '/latest.json'
          try {
            $check = Invoke-RestMethod -Uri $url -TimeoutSec 30
            Write-Host "РљР°РЅР°Р» РѕС‚РІРµС‡Р°РµС‚, РІРµСЂСЃРёСЏ РІ РјР°РЅРёС„РµСЃС‚Рµ: $($check.version)"
          } catch {
            throw "РљР°РЅР°Р» $url РЅРµ РѕС‚РґР°С‘С‚ РјР°РЅРёС„РµСЃС‚: $($_.Exception.Message)"
          }

# Р—Р°РїСѓСЃРє С‚РѕР»СЊРєРѕ РїРѕ С‚РµРіСѓ `android-tv-v<РІРµСЂСЃРёСЏ>`. РќРѕРјРµСЂ СЃРІРµСЂСЏРµС‚СЃСЏ СЃ package.json. РРјРµРЅР° С„Р°Р№Р»РѕРІ
# РѕР±СЏР·Р°С‚РµР»СЊРЅС‹: AniMori_<РІРµСЂСЃРёСЏ>_armv7.apk Рё _arm64.apk. РћС‚РјРµРЅР°: СЃРЅР°С‡Р°Р»Р° Cancel.

name: release-tv

on:
  push:
    tags:
      - 'android-tv-v*'

  # Р СѓС‡РЅРѕР№ Р·Р°РїСѓСЃРє вЂ” РґР»СЏ РїСЂРѕРіРѕРЅР° Р±РµР· РІС‹РїСѓСЃРєР°: РєРѕРЅРІРµР№РµСЂ СЃС‚РѕРёС‚ РїСЂРѕРІРµСЂРёС‚СЊ Р·Р°СЂР°РЅРµРµ
  # (sdkmanager, РїР»Р°С‚С„РѕСЂРјР°, NDK, npm ci). РџСЂРѕР±РЅС‹Р№ РїСЂРѕРіРѕРЅ РїСѓР±Р»РёРєР°С†РёСЋ РїСЂРѕРїСѓСЃРєР°РµС‚.
  workflow_dispatch:
    inputs:
      tag:
        description: 'РўРµРі РІС‹РїСѓСЃРєР°'
        required: true
        default: 'android-tv-v3.1.1'
      dry:
        description: 'РџСЂРѕР±РЅС‹Р№ РїСЂРѕРіРѕРЅ: СЃРѕР±СЂР°С‚СЊ Рё РїРѕРґРїРёСЃР°С‚СЊ, РЅРѕ СЂРµР»РёР· РЅРµ РїСѓР±Р»РёРєРѕРІР°С‚СЊ'
        type: boolean
        default: true

# Р‘РµР· СЌС‚РѕРіРѕ С‚РѕРєРµРЅ РїСЂРѕРіРѕРЅР° С‚РѕР»СЊРєРѕ С‡РёС‚Р°РµС‚, Рё СЃРѕР·РґР°РЅРёРµ СЂРµР»РёР·Р° СѓРїР°РґС‘С‚ РЅР° 403.
permissions:
  contents: write

jobs:
  build:
    # РљРѕРґ РїСЂРёСЃС‚Р°РІРєРё Р»РµР¶РёС‚ РІ apps/android-tv, Р° РєРѕРЅРІРµР№РµСЂ вЂ” РІ РєРѕСЂРЅРµ: GitHub С‡РёС‚Р°РµС‚
    # .github/workflows С‚РѕР»СЊРєРѕ РѕС‚С‚СѓРґР°. РџРѕСЌС‚РѕРјСѓ РєР°С‚Р°Р»РѕРі Р·Р°РґР°С‘С‚СЃСЏ Р·РґРµСЃСЊ, Р° РЅРµ РїСѓС‚СЏРјРё РІ РєРѕРјР°РЅРґР°С….
    defaults:
      run:
        working-directory: apps/android-tv

    # Р Р°Р·СЂСЏРґРЅРѕСЃС‚СЊ вЂ” РѕС‚РґРµР»СЊРЅС‹Рј РїСЂРѕРіРѕРЅРѕРј: Rust РєРѕРјРїРёР»РёСЂСѓРµС‚СЃСЏ РїРѕРґ РєР°Р¶РґСѓСЋ С†РµР»СЊ
    # Р·Р°РЅРѕРІРѕ, Рё РІ РѕРґРЅРѕРј РїСЂРѕРіРѕРЅРµ РІС‚РѕСЂР°СЏ СЃР±РѕСЂРєР° РЅРµ РІР·СЏР»Р° Р±С‹ РЅРёС‡РµРіРѕ РёР· РїРµСЂРІРѕР№.
    strategy:
      fail-fast: false
      matrix:
        # abi вЂ” РїСЂРёСЃС‚Р°РІРєР° РІ РёРјРµРЅРё С„Р°Р№Р»Р° (РµС‘ РёС‰РµС‚ src/app/update.ts РїРѕ СЂР°Р·СЂСЏРґРЅРѕСЃС‚Рё
        # СѓСЃС‚СЂРѕР№СЃС‚РІР°); target вЂ” С‚СЂРѕР№РєР° Rust; cli вЂ” РёРјСЏ С†РµР»Рё РґР»СЏ `tauri android build`.
        include:
          - abi: armv7
            target: armv7-linux-androideabi
            cli: armv7
          - abi: arm64
            target: aarch64-linux-android
            cli: aarch64

    runs-on: ubuntu-latest

    steps:
      - name: РСЃС…РѕРґРЅС‹Р№ РєРѕРґ
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Node 24 вЂ” С‚Р° Р¶Рµ РІРµСЂСЃРёСЏ, С‡С‚Рѕ РІ ci.yml Рё release.yml: lock РіРµРЅРµСЂРёСЂСѓРµС‚
          # npm 11, Р° npm 10 РёР· node 22 РѕС‚РІРµСЂРіР°РµС‚ РµРіРѕ РЅР° npm ci.
          node-version: 24
          cache: npm

      # РќРѕРјРµСЂ РІРµСЂСЃРёРё РёР· РёРјРµРЅРё С‚РµРіР° Рё СЃРІРµСЂРєР° СЃ package.json. РќРѕРјРµСЂ Р±РµСЂС‘С‚СЃСЏ РѕР±СЂР°Р·С†РѕРј,
      # Р° РЅРµ РѕС‚СЂРµР·Р°РЅРёРµРј РїСЂРёСЃС‚Р°РІРєРё: С‚РµРі android-tv-v3.0 С‚РёС…Рѕ РґР°Р» Р±С‹ СЃС‚СЂР°РЅРЅРѕРµ РёРјСЏ С„Р°Р№Р»Р°.
      - name: РќРѕРјРµСЂ РІРµСЂСЃРёРё РёР· С‚РµРіР°
        id: ver
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          if [[ ! "$tag" =~ ^android-tv-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::РРјСЏ С‚РµРіР° '$tag' РЅРµ РїРѕРґС…РѕРґРёС‚ РїРѕРґ android-tv-v<РІРµСЂСЃРёСЏ>"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          declared="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$declared" ]]; then
            echo "::error::РќРѕРјРµСЂ РІ С‚РµРіРµ ($version) СЂР°СЃС…РѕРґРёС‚СЃСЏ СЃ package.json ($declared)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Р’С‹РїСѓСЃРє РїСЂРёСЃС‚Р°РІРєРё: $version (С‚РµРі $tag)"

      - name: РћРєСЂСѓР¶РµРЅРёРµ Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      # РљРѕРјРїРёР»СЏС†РёСЏ Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№ Tauri СЃ РЅСѓР»СЏ вЂ” СЌС‚Рѕ РјРёРЅСѓС‚С‹. РљСЌС€ РїСЂРёРІСЏР·Р°РЅ Рє
      # Cargo.lock, РєРѕС‚РѕСЂС‹Р№ Сѓ РЅР°СЃ Р·Р°РєРѕРјРјРёС‡РµРЅ, РїРѕСЌС‚РѕРјСѓ РїРѕРїР°РґР°РЅРёРµ СЃС‚Р°Р±РёР»СЊРЅРѕ.
      - name: РљСЌС€ Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      # Java 17: РµРіРѕ С‚СЂРµР±СѓРµС‚ Android Gradle Plugin 8.x. Р‘РѕР»РµРµ РЅРѕРІС‹Р№ РЅРµ РЅСѓР¶РµРЅ,
      # Р° Р±РѕР»РµРµ СЃС‚Р°СЂС‹Р№ Gradle 8.14 РЅРµ РїСЂРёРјРµС‚ РІРѕРІСЃРµ.
      - name: Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 17
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # РџР°РєРµС‚С‹ СЃС‚Р°РІСЏС‚СЃСЏ СЏРІРЅРѕ: Р±РµР· NDK Rust РЅРµ СЃРѕР±РµСЂС‘С‚СЃСЏ, Р° СЂР°СЃС…РѕР¶РґРµРЅРёРµ РІРµСЂСЃРёР№ NDK
      # РјРµР¶РґСѓ СЃР±РѕСЂРєР°РјРё РґР°С‘С‚ СЂР°Р·РЅС‹Рµ .so.
      - name: РџР°РєРµС‚С‹ SDK
        run: |
          set -euo pipefail

          # Р›РёС†РµРЅР·РёРё РїСЂРёРЅРёРјР°СЋС‚СЃСЏ РѕС‚РІРµС‚РѕРј РёР· С„Р°Р№Р»Р°, Р° РЅРµ С‚СЂСѓР±РѕР№ `yes | вЂ¦`: РЅР° СЃРІРµР¶РµРј
          # РѕР±СЂР°Р·Рµ СЂР°РЅРЅРµСЂР° `yes` РїРѕР»СѓС‡Р°РµС‚ broken pipe, Рё РїРѕРґ pipefail С€Р°Рі РїР°РґР°РµС‚.
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' > "$RUNNER_TEMP/sdk-yes.txt"
          sdkmanager --licenses < "$RUNNER_TEMP/sdk-yes.txt" > /dev/null 2>&1 || true

          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;30.0.15729638"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" ]]; then
            echo "::error::РќРё ANDROID_HOME, РЅРё ANDROID_SDK_ROOT РЅРµ Р·Р°РґР°РЅС‹"
            exit 1
          fi
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_NDK_HOME=$sdk/ndk/30.0.15729638"
            echo "NDK_HOME=$sdk/ndk/30.0.15729638"
          } >> "$GITHUB_ENV"

      # РќСѓР¶РЅС‹ РґР»СЏ beforeBuildCommand: СЃР±РѕСЂРєСѓ РїРµСЂРµРґРЅРµРіРѕ РєСЂР°СЏ (npm run build:app)
      # Р·Р°РїСѓСЃРєР°РµС‚ СЃР°Рј tauri РїРµСЂРµРґ РєРѕРјРїРёР»СЏС†РёРµР№ Rust.
      # РџСЂРѕРІРµСЂРєР° РґРѕ СЃР±РѕСЂРєРё. Р‘РµР· РЅРµС‘ РїСѓСЃС‚РѕР№ СЃРµРєСЂРµС‚ РІСЃРїР»С‹РІР°РµС‚ С‡РµСЂРµР· СЃРµРјСЊ РјРёРЅСѓС‚
      # РєРѕРјРїРёР»СЏС†РёРё Рё РІР°Р»РёС‚ apksigner РѕС€РёР±РєРѕР№ РїСЂРѕ DER (В«Tag number over 30В»), РёР·
      # РєРѕС‚РѕСЂРѕР№ РєР»СЋС‡Р° РЅРµ РІРёРґРЅРѕ: РєР»СЋС‡Р° С‚Р°Рј Рё РЅРµ Р±С‹Р»Рѕ. РРјРµРЅР° СЃРµРєСЂРµС‚РѕРІ вЂ” С‚Рµ Р¶Рµ, С‡С‚Рѕ
      # Р¶РґСѓС‚ С€Р°РіРё РЅРёР¶Рµ; Р·РЅР°С‡РµРЅРёСЏ СЃРєРѕРїРёСЂРѕРІР°РЅС‹ РёР· Animori-TV РІСЂСѓС‡РЅСѓСЋ, API РёС… РЅРµ
      # РѕС‚РґР°С‘С‚.
      - name: РџСЂРѕРІРµСЂРєР° СЃРµРєСЂРµС‚РѕРІ РїРѕРґРїРёСЃРё
        env:
          KS_BASE64: ${{ secrets.ANIMORI_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANIMORI_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANIMORI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANIMORI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for v in KS_BASE64 KS_PASSWORD KS_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            echo "::error::РџСѓСЃС‚С‹Рµ СЃРµРєСЂРµС‚С‹ РїРѕРґРїРёСЃРё: ${missing[*]}. Р—Р°РґР°С‚СЊ РІ Settings в†’ Secrets and variables в†’ Actions СЂРµРїРѕР·РёС‚РѕСЂРёСЏ Animori"
            exit 1
          fi
          echo "Р’СЃРµ С‡РµС‚С‹СЂРµ СЃРµРєСЂРµС‚Р° РїРѕРґРїРёСЃРё РЅР° РјРµСЃС‚Рµ."

      - name: Р—Р°РІРёСЃРёРјРѕСЃС‚Рё npm
        # РЈСЃС‚Р°РЅРѕРІРєР° РёР· РєРѕСЂРЅСЏ: Р·Р°РјРѕРє РѕРґРёРЅ РЅР° СЂРµРїРѕР·РёС‚РѕСЂРёР№, РІ РєР°С‚Р°Р»РѕРіРµ РїСЂРёР»РѕР¶РµРЅРёСЏ РµРіРѕ РЅРµС‚.
        working-directory: .
        run: npm ci

      # РЎР±РѕСЂРєР°. Р¤Р°Р№Р» РІС‹С…РѕРґРёС‚ РЅРµРїРѕРґРїРёСЃР°РЅРЅС‹Рј вЂ” С‚Р°Рє РґРµР»Р°РµС‚ Tauri Рё РЅР° РєРѕРјРїСЊСЋС‚РµСЂРµ:
      # РєР»СЋС‡Р° РІС‹РїСѓСЃРєР° Сѓ РЅРµРіРѕ РЅРµС‚. РџРѕРґРїРёСЃС‹РІР°РµРј СЃР»РµРґСѓСЋС‰РёРј С€Р°РіРѕРј.
      - name: РЎР±РѕСЂРєР° APK
        run: npm run tauri -- android build -t ${{ matrix.cli }}

      # РџРѕСЂСЏРґРѕРє РѕР±СЏР·Р°С‚РµР»РµРЅ: zipalign РґРѕ РїРѕРґРїРёСЃРё, Р° РїРѕРґРїРёСЃР°РЅРЅС‹Р№ С„Р°Р№Р» С‚СЂРѕРіР°С‚СЊ РЅРµР»СЊР·СЏ вЂ”
      # РІС‹СЂР°РІРЅРёРІР°РЅРёРµ СЃРґРІРёРЅРµС‚ СЃРѕРґРµСЂР¶РёРјРѕРµ, Рё РїРѕРґРїРёСЃСЊ РїРµСЂРµСЃС‚Р°РЅРµС‚ СЃС…РѕРґРёС‚СЊСЃСЏ.
      - name: РџРѕРґРїРёСЃСЊ APK
        env:
          KS_BASE64: ${{ secrets.ANIMORI_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANIMORI_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANIMORI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANIMORI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version='${{ steps.ver.outputs.version }}'
          abi='${{ matrix.abi }}'
          tools="$ANDROID_HOME/build-tools/35.0.0"

          # РћРґРёРЅ С„Р°Р№Р», Р° РЅРµ В«РїРµСЂРІС‹Р№ РїРѕРїР°РІС€РёР№СЃСЏВ»: РґРІР° APK РІ РІС‹РІРѕРґРµ РѕР·РЅР°С‡Р°СЋС‚,
          # С‡С‚Рѕ СЃР±РѕСЂРєР° РїРѕР»РѕР¶РёР»Р° СЂСЏРґРѕРј РѕСЃС‚Р°С‚РѕРє РїСЂРµР¶РЅРµР№, Рё РїРѕРґРїРёСЃР°С‚СЊ РјРѕР¶РЅРѕ РЅРµ С‚Рѕ.
          mapfile -t found < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          if [[ "${#found[@]}" -ne 1 ]]; then
            echo "::error::Р’ РІС‹РІРѕРґРµ СЃР±РѕСЂРєРё РЅРµ РѕРґРёРЅ APK: ${found[*]}"
            exit 1
          fi

          mkdir -p out
          echo "$KS_BASE64" | base64 -d > out/animori.jks

          # РҐСЂР°РЅРёР»РёС‰Рµ РєР»СЋС‡Р° Р±С‹РІР°РµС‚ РґРІСѓС… РІРёРґРѕРІ: JKS РЅР°С‡РёРЅР°РµС‚СЃСЏ СЃ РјР°РіРёРё FEEDFEED,
          # PKCS12 вЂ” СЃ DER-РјРµС‚РєРё 0x30. РџСЂРѕРІРµСЂСЏС‚СЊ РЅР°РґРѕ РѕР±Рµ, Р° РЅРµ РѕРґРЅСѓ: РєР»СЋС‡ РІС‹РїСѓСЃРєР°
          # СЃРґРµР»Р°РЅ РІ JKS, Рё РїСЂРѕРІРµСЂРєР° С‚РѕР»СЊРєРѕ РЅР° 0x30 РѕС‚РєР»РѕРЅРёР»Р° Р±С‹ РµРіРѕ СЃ Р»РѕР¶РЅС‹Рј
          # В«РЅРµ РґРµРєРѕРґРёСЂРѕРІР°Р»РѕСЃСЊВ», С…РѕС‚СЏ С„Р°Р№Р» С†РµР»С‹Р№.
          size=$(stat -c%s out/animori.jks)
          magic=$(od -An -tx1 -N4 out/animori.jks | tr -d ' ')
          if [[ "$size" -lt 100 || ( "$magic" != "feedfeed" && "${magic:0:2}" != "30" ) ]]; then
            echo "::error::РҐСЂР°РЅРёР»РёС‰Рµ РЅРµ РїРѕС…РѕР¶Рµ РЅРё РЅР° JKS, РЅРё РЅР° PKCS12: ${size} Р±Р°Р№С‚, РЅР°С‡Р°Р»Рѕ 0x${magic}"
            exit 1
          fi

          "$tools/zipalign" -p -f 4 "${found[0]}" out/aligned.apk

          java -jar "$tools/lib/apksigner.jar" sign \
            --ks out/animori.jks \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "out/AniMori_${version}_${abi}.apk" \
            out/aligned.apk

          # РџСЂРѕРІРµСЂРєР° РїРµСЂРµРґ РІС‹РєР»Р°РґРєРѕР№: РЅРµРїРѕРґРїРёСЃР°РЅРЅС‹Р№ РёР»Рё Р±РёС‚С‹Р№ С„Р°Р№Р» РїСЂРёСЃС‚Р°РІРєР°
          # РЅРµ РїРѕСЃС‚Р°РІРёС‚, Р° РїРѕР№РјС‘С‚ СЌС‚Рѕ С‡РµР»РѕРІРµРє Р»РёС€СЊ РЅР°Р¶Р°РІ В«РЈСЃС‚Р°РЅРѕРІРёС‚СЊВ».
          java -jar "$tools/lib/apksigner.jar" verify "out/AniMori_${version}_${abi}.apk"

          rm -f out/animori.jks out/aligned.apk
          ls -l "out/AniMori_${version}_${abi}.apk"

      - name: РђСЂС‚РµС„Р°РєС‚ РїСЂРѕРіРѕРЅР°
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apk-${{ matrix.abi }}
          # РџСѓС‚СЊ РѕС‚ РєРѕСЂРЅСЏ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ, Р° РЅРµ РѕС‚ РєР°С‚Р°Р»РѕРіР° РїСЂРёР»РѕР¶РµРЅРёСЏ: Сѓ
          # upload-artifact РЅРµС‚ РїР°СЂР°РјРµС‚СЂР° working-directory, Рё defaults.run РµРіРѕ
          # РЅРµ РїРѕРґСЃС‚Р°РІР»СЏРµС‚. РЁР°Рі РІС‹С€Рµ РїРёС€РµС‚ РІ apps/android-tv/out, Р° Р·Р°РіСЂСѓР·С‡РёРє РёСЃРєР°Р»
          # РІ РєРѕСЂРЅРµ Рё СЂР°РїРѕСЂС‚РѕРІР°Р» В«No files were foundВ» РїСЂРё Р¶РёРІРѕРј С„Р°Р№Р»Рµ.
          path: apps/android-tv/out/AniMori_${{ steps.ver.outputs.version }}_${{ matrix.abi }}.apk
          if-no-files-found: error

  publish:
    # РљР°С‚Р°Р»РѕРі С‚РѕС‚ Р¶Рµ, С‡С‚Рѕ Рё РІ Р·Р°РґР°С‡Рµ СЃР±РѕСЂРєРё: С€Р°РіРё С‡РёС‚Р°СЋС‚ package.json Рё CHANGELOG.
    defaults:
      run:
        working-directory: apps/android-tv

    # РћС‚РґРµР»СЊРЅРѕР№ Р·Р°РґР°С‡РµР№, Р° РЅРµ С€Р°РіРѕРј РІРЅСѓС‚СЂРё СЃР±РѕСЂРєРё: СЂРµР»РёР· РѕРґРёРЅ РЅР° РґРІРµ
    # СЂР°Р·СЂСЏРґРЅРѕСЃС‚Рё, Рё СЃРѕР·РґР°РІР°С‚СЊ РµРіРѕ РґРѕР»Р¶РµРЅ С‚РѕС‚, РєС‚Рѕ РґРѕР¶РґР°Р»СЃСЏ РѕР±РµРёС… СЃР±РѕСЂРѕРє.
    needs: build
    runs-on: ubuntu-latest

    # РџСЂРѕР±РЅС‹Р№ РїСЂРѕРіРѕРЅ СЃСЋРґР° РЅРµ РґРѕС…РѕРґРёС‚: СЃР±РѕСЂРєРё СѓР¶Рµ РїСЂРѕРІРµСЂРёР»Рё РєР»СЋС‡ Рё РїРѕРґРїРёСЃСЊ,
    # Р° РІС‹РїСѓСЃРєР°С‚СЊ РЅРµС‡РµРіРѕ.
    if: ${{ github.event_name == 'push' || !inputs.dry }}

    steps:
      - name: РСЃС…РѕРґРЅС‹Р№ РєРѕРґ
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: РќРѕРјРµСЂ РІРµСЂСЃРёРё РёР· С‚РµРіР°
        id: ver
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          if [[ ! "$tag" =~ ^android-tv-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::РРјСЏ С‚РµРіР° '$tag' РЅРµ РїРѕРґС…РѕРґРёС‚ РїРѕРґ android-tv-v<РІРµСЂСЃРёСЏ>"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      # РћРїРёСЃР°РЅРёРµ СЂРµР»РёР·Р° Р±РµСЂС‘С‚СЃСЏ РёР· РІРµРґСѓС‰РµРіРѕ Р°Р±Р·Р°С†Р° СЂР°Р·РґРµР»Р°: РїРѕРґСЂРѕР±РЅРѕСЃС‚Рё Р»РµР¶Р°С‚
      # РІ CHANGELOG.md, Р° РІ РѕРєРЅРѕ РѕР±РЅРѕРІР»РµРЅРёСЏ С†РµР»РёРєРѕРј СЂР°Р·РґРµР» РЅРµ Р»РµР·РµС‚.
      - name: РћРїРёСЃР°РЅРёРµ СЂРµР»РёР·Р° РёР· CHANGELOG
        id: notes
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib

          lines = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()

          # Р—Р°РіРѕР»РѕРІРѕРє СЂР°Р·РґРµР»Р° вЂ” В«## [РІРµСЂСЃРёСЏ]В». Р РµРґР°РєС‚РѕСЂ СѓРјРµРµС‚ СЌРєСЂР°РЅРёСЂРѕРІР°С‚СЊ СЃРєРѕР±РєСѓ
          # (В«## \[3.0.2]В»), Рё С‚Р°РєРѕР№ Р·Р°РіРѕР»РѕРІРѕРє СЂР°Р·РґРµР»РѕРј С‚РѕР¶Рµ СЃС‡РёС‚Р°РµРј: РІС‹РїСѓСЃРє РЅРµ РґРѕР»Р¶РµРЅ
          # РїР°РґР°С‚СЊ РёР·-Р·Р° РѕРґРЅРѕР№ РєР°РІС‹С‡РєРё РІ Р·Р°РіРѕР»РѕРІРєРµ.
          def is_section(line):
              return line.startswith('## ') and line.replace('\\', '').lstrip('#').strip().startswith('[')

          marks = [i for i, line in enumerate(lines) if is_section(line)]
          if not marks:
              raise SystemExit('Р’ CHANGELOG.md РЅРµ РЅР°Р№РґРµРЅРѕ РЅРё РѕРґРЅРѕРіРѕ СЂР°Р·РґРµР»Р° РІРёРґР° "## [РІРµСЂСЃРёСЏ]"')

          start = marks[0] + 1
          end = marks[1] if len(marks) > 1 else len(lines)

          # Р’РµРґСѓС‰РёР№ Р°Р±Р·Р°С†: РґРѕ РїРµСЂРІРѕРіРѕ РїРѕРґР·Р°РіРѕР»РѕРІРєР° Р»СЋР±РѕРіРѕ СѓСЂРѕРІРЅСЏ.
          stop = end
          for i in range(start, end):
              if lines[i].lstrip().startswith('#'):
                  stop = i
                  break

          body = '\n'.join(lines[start:stop]).strip()
          if not body:
              raise SystemExit('РЈ СЂР°Р·РґРµР»Р° РЅРµС‚ РІРµРґСѓС‰РµРіРѕ Р°Р±Р·Р°С†Р°: РЅРµС‡РµРіРѕ РїРѕРєР°Р·Р°С‚СЊ РІ РѕРєРЅРµ РѕР±РЅРѕРІР»РµРЅРёСЏ')

          # РћРєРЅРѕ РѕР±РЅРѕРІР»РµРЅРёСЏ СѓСЂРµР¶РµС‚ С‚РµРєСЃС‚ СЃР°РјРѕ (NOTES_LIMIT РІ src/app/update.ts),
          # РЅРѕ РґР»РёРЅРЅРѕРµ РѕРїРёСЃР°РЅРёРµ РЅРµ РЅСѓР¶РЅРѕ Рё РЅР° СЃС‚СЂР°РЅРёС†Рµ РІС‹РїСѓСЃРєР°.
          if len(body) > 1200:
              body = body[:1200].rstrip() + 'вЂ¦'

          # РџРѕРґРІР°Р» РїРѕСЃР»Рµ РѕР±СЂРµР·РєРё, С‡С‚РѕР±С‹ РѕРЅР° РµРіРѕ РЅРµ СЃСЉРµР»Р°: РїСЂР°РІРѕРІС‹Рµ РґРѕРєСѓРјРµРЅС‚С‹ РЅР° СЃС‚СЂР°РЅРёС†Рµ РІС‹РїСѓСЃРєР°.
          body += '\n\nвЂ” РџРѕР»РёС‚РёРєР°: https://github.com/foulnike/Animori/blob/main/docs/PRIVACY.md В· РЈСЃР»РѕРІРёСЏ: https://github.com/foulnike/Animori/blob/main/docs/TERMS.md'

          print('body<<ANIMORI_NOTES')
          print(body)
          print('ANIMORI_NOTES')
          PY

      - name: РЎРѕР±СЂР°С‚СЊ С„Р°Р№Р»С‹ РІС‹РїСѓСЃРєР°
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      # РџСЂРµРґРІР°СЂРёС‚РµР»СЊРЅС‹Р№ вЂ” РѕР±СЏР·Р°С‚РµР»СЊРЅРѕ, Рё СЌС‚Рѕ РЅРµ РїСЂРѕ В«Р±РµС‚Р°В». РђРґСЂРµСЃ
      # `releases/latest` РґРѕСЃС‚Р°С‘С‚СЃСЏ СЃС‚Р°СЂС‹Рј СЃР±РѕСЂРєР°Рј Windows: Сѓ РЅРёС… РѕРЅ РІС€РёС‚ РІ Р±РёР»СЊРЅРёРє
      # Рё СЃРјРµРЅРёС‚СЊ РµРіРѕ СѓР¶Рµ РЅРµР»СЊР·СЏ. РџРѕРєР° Сѓ РїСЂРёСЃС‚Р°РІРєРё Р±С‹Р» РѕР±С‹С‡РЅС‹Р№ СЂРµР»РёР·, РѕРЅ СЃС‚Р°РЅРѕРІРёР»СЃСЏ
      # РїРѕСЃР»РµРґРЅРёРј РІ СЂРµРїРѕР·РёС‚РѕСЂРёРё, `releases/latest` СѓРµР·Р¶Р°Р» РЅР° РЅРµРіРѕ, Р° `latest.json`
      # С‚Р°Рј РЅРµС‚ вЂ” Рё РѕР±РЅРѕРІР»РµРЅРёРµ Сѓ РІСЃРµС…, РєС‚Рѕ СЃРёРґРµР» РЅР° 3.0.x, РјРѕР»С‡Р° РЅРµ РїСЂРёС…РѕРґРёР»Рѕ.
      # РџСЂРµРґРІР°СЂРёС‚РµР»СЊРЅС‹Рµ СЂРµР»РёР·С‹ `releases/latest` РїСЂРѕРїСѓСЃРєР°РµС‚, Р° СЃРїРёСЃРѕРє СЂРµР»РёР·РѕРІ
      # (/releases) РёС… СЃРѕРґРµСЂР¶РёС‚, РїРѕСЌС‚РѕРјСѓ Р°РїРґРµР№С‚РµСЂ РїСЂРёСЃС‚Р°РІРєРё вЂ” РєРѕС‚РѕСЂС‹Р№ РёС‰РµС‚ СЃРІРѕР№
      # РІС‹РїСѓСЃРє РїРѕ РїСЂРµС„РёРєСЃСѓ С‚РµРіР° `android-tv-v` вЂ” РІРёРґРёС‚ Рё РѕР±РЅРѕРІР»СЏРµС‚СЃСЏ РєР°Рє РѕР±С‹С‡РЅРѕ.
      # Р§РµСЂРЅРѕРІРёРє, РІ РѕС‚Р»РёС‡РёРµ РѕС‚ РїСЂРµРґРІР°СЂРёС‚РµР»СЊРЅРѕРіРѕ, РІ Р°РЅРѕРЅРёРјРЅРѕРј СЃРїРёСЃРєРµ РЅРµ РІРёРґРµРЅ РІРѕРІСЃРµ,
      # РїРѕСЌС‚РѕРјСѓ draft РѕСЃС‚Р°С‘С‚СЃСЏ РІС‹РєР»СЋС‡РµРЅРЅС‹Рј.
      - name: Р РµР»РёР·
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # РџР»Р°С‚С„РѕСЂРјР° РІ РЅР°Р·РІР°РЅРёРё: РѕР±Р° РїСЂРѕРґСѓРєС‚Р° Р¶РёРІСѓС‚ РІ РѕРґРЅРѕРј СЂРµРїРѕР·РёС‚РѕСЂРёРё, Рё Р±РµР· РЅРµС‘
          # РЅР° СЃС‚СЂР°РЅРёС†Рµ Releases РґРІРµ СЃС‚СЂРѕРєРё В«AniMori 3.1.1В» РЅРµ РѕС‚Р»РёС‡РёС‚СЊ. РђРїРґРµР№С‚РµСЂ
          # РїСЂРёСЃС‚Р°РІРєРё РЅР°Р·РІР°РЅРёРµ РЅРµ С‡РёС‚Р°РµС‚ РІРѕРІСЃРµ вЂ” РѕРЅ СЃРјРѕС‚СЂРёС‚ РЅР° tag_name Рё body.
          name: AniMori ${{ steps.ver.outputs.version }} вЂ” Android TV
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: true
          files: dist/*.apk

# Проверки на каждый пуш. Gradle и сборщик APK здесь не трогаются: это чтение
# файлов, проверка типов, vitest и Rust-слой — cargo check / clippy / fmt на оба
# src-tauri. Полная сборка живёт в release.yml и release-tv.yml и ходит по тегу.
#
# Пока эти задачи не существовали, наборы vitest не гонял вообще никто: проверки
# краснели и тихо ждали ручного прогона. Так в приставке и дожили до семнадцати
# падений, которые заметили через две ревизии.
#
# Сторож расхождений ядра удалён вместе с дублированием: ядро теперь одно,
# и сверять его больше не с чем.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Проверки только читают: ни ветку, ни выпуск, ни настройки они не трогают.
# Без блока токен прогона берётся шире нужного, и у задач остаются права на запись
# там, где им нечего писать. В выпусках нужно обратное — там `contents: write`,
# см. release.yml и release-tv.yml.
permissions:
  contents: read

jobs:
  # Наборы общего ядра: одни на оба продукта, потому что ядро одно.
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      # Формат: без этого шага договорённость о стиле держалась только на памяти,
      # и Prettier молча пропускал старые файлы. Проверка одна на весь репозиторий.
      - name: Формат
        run: npm run format:check

      # Расхождение копий между продуктами: ловит правку, доехавшую только до одного края.
      # Различие само по себе не ошибка — падает лишь рост сверх зафиксированного.
      - name: Расхождение копий
        run: npm run drift

      - name: Наборы ядра
        run: npm run test:core

  # Настольное приложение: экранные наборы и граница ядра.
  #
  # Установка всегда из корня: замок один на репозиторий, и в каталоге приложения
  # его нет — `npm ci` там падает. Рабочие области поднимают всё в корневой
  # node_modules, откуда приложение и берёт зависимости.
  windows:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        working-directory: apps/windows
        run: npm run typecheck:all

      - name: Линтер
        run: npm run lint

      - name: Наборы экранов
        working-directory: apps/windows
        run: npm test

  # Приставка: свой экран, тот же код ядра. Node 20 вне поддержки с апреля 2026.
  android-tv:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        working-directory: apps/android-tv
        run: npm run typecheck:all

      - name: Линтер
        run: npm run lint

      - name: Наборы экранов
        working-directory: apps/android-tv
        run: npm test

  # Rust-слой: оба src-tauri раньше компилировались только на релизном теге, и
  # ошибка компиляции находилась в момент выпуска, а не на пуше. Проверки идут
  # на Windows: боевой код (proxy_auth, webview2) живёт под cfg(windows) и на
  # Linux не компилируется вовсе, а wry на Linux тянул бы системный webkit2gtk.
  #
  # Матрица по продуктам, а не один job с двумя каталогами: падение одного crate
  # не должно прятать падение другого. fail-fast выключен — сначала видим обе картины.
  rust:
    strategy:
      fail-fast: false
      matrix:
        app: [windows, android-tv]

    runs-on: windows-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v5

      - name: Окружение Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Компиляция зависимостей Tauri с нуля — минуты. Ключ матричный: job-id и
      # хэш Cargo.lock у обеих строк общие, и без `key` они делили бы один кэш,
      # затирая target-каталог друг друга. Порядок важен: кэш привязывается к
      # версии rustc из текущего окружения, поэтому ставится после тулчейна.
      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri
          key: ${{ matrix.app }}

      # generate_context! читает frontendDist на этапе компиляции, а dist/ в
      # .gitignore — на свежем чекауте каталога нет и check падает. Собранный
      # фронт для проверки Rust не нужен: макросу достаточно, чтобы каталог существовал.
      - name: Заглушка каталога сборки
        run: New-Item -ItemType Directory -Force dist/app | Out-Null
        working-directory: apps/${{ matrix.app }}

      # Формат первым: он не компилирует и отдаёт результат за секунды.
      # Дальше check — дешевле clippy; clippy --all-targets покрывает и тесты.
      - name: Формат
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo fmt --check

      - name: Проверка компиляции
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo check --workspace

      - name: Линт
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo clippy --all-targets -- -D warnings

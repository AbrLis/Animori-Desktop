# Проверки на каждый пуш. Ни Rust, ни Gradle, ни сборщик APK здесь не трогаются:
# это чтение файлов, проверка типов и vitest. Полная сборка живёт в release.yml
# и release-tv.yml и ходит по тегу.
#
# Пока эти задачи не существовали, наборы vitest не гонял вообще никто: проверки
# краснели и тихо ждали ручного прогона. Так в приставке и дожили до семнадцати
# падений, которые заметили через две ревизии.
#
# Сторож расхождений ядра удалён вместе с дублированием: ядро теперь одно,
# и сверять его больше не с чем.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Наборы общего ядра: одни на оба продукта, потому что ядро одно.
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      # Расхождение копий между продуктами: ловит правку, доехавшую только до одного края.
      # Различие само по себе не ошибка — падает лишь рост сверх зафиксированного.
      - name: Расхождение копий
        run: npm run drift

      - name: Наборы ядра
        run: npm run test:core

  # Настольное приложение: экранные наборы и граница ядра.
  #
  # Установка всегда из корня: замок один на репозиторий, и в каталоге приложения
  # его нет — `npm ci` там падает. Рабочие области поднимают всё в корневой
  # node_modules, откуда приложение и берёт зависимости.
  windows:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        working-directory: apps/windows
        run: npm run typecheck:all

      - name: Линтер
        run: npm run lint

      - name: Наборы экранов
        working-directory: apps/windows
        run: npm test

  # Приставка: свой экран, тот же код ядра. Node 20 вне поддержки с апреля 2026.
  android-tv:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        working-directory: apps/android-tv
        run: npm run typecheck:all

      - name: Линтер
        run: npm run lint

      - name: Наборы экранов
        working-directory: apps/android-tv
        run: npm test

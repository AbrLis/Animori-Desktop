<!-- Знак MyAnimeList: буквы MAL с иконки самого сайта.

     Растр, а не пути: открытого вектора у MAL нет, а нарисованные
     нами буквы выходили кривыми — плотную «M» и перекладину «A»
     на высоте 15 пикселей не спасала никакая правка штриха.
     Картинка вчетверо крупнее знака на плите, поэтому дробный
     масштаб окна её не мылит.

     Буквы белые с прозрачным фоном: цвет плиты даёт BrandMark.vue,
     и знак не носит с собой синего квадрата.

     Строка с данными длиннее принятых 100 знаков намеренно:
     в base64 внутри адреса переносы ставить нельзя. -->
